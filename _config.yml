title: "Sistemas Embarcados — LEDs, Displays e Efeitos Visuais com ESP32"
description: "Mini curso para o Curso Técnico em Automação Industrial. LEDs RGB WS2812B, displays de 7 segmentos e registrador 74HC595 com MicroPython — efeitos, animações, codificação e expansão de saídas."

theme: jekyll-theme-cayman

baseurl: "/minicurso_05-embarcados"
url: "https://rogeriomb-hub.github.io"

# Navegação entre páginas
header_pages:
  - index.md
  - aulas/aula00-extra-tuplas.md
  - aulas/aula01-primeiro-pixel.md
  - aulas/aula02-efeitos-lista.md
  - aulas/aula03-paleta-dicionario.md
  - aulas/aula04-efeitos-animados.md
  - aulas/aula05-meteoro-respiracao-cometa.md
  - aulas/aula05-extra-codificadores-decodificadores.md
  - aulas/aula06-display-7-segmentos.md
  - aulas/aula07-registrador-74hc595.md

# Configurações gerais
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

rouge:
  wrap: true

exclude:
  - "*.zip"
  - COMO-PUBLICAR.md
  - GUIA-CONSTRUCAO.md
