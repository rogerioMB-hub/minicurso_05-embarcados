<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 480" width="1360" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b4b"/>
      <stop offset="100%" stop-color="#152060"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1360" height="480" fill="url(#bg)"/>

  <!-- Grade -->
  <g stroke="#1e468c" stroke-width="1" opacity="0.5">
    <line x1="60"  y1="0" x2="60"  y2="480"/> <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="480"/> <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/> <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="420" y1="0" x2="420" y2="480"/> <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="540" y1="0" x2="540" y2="480"/> <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="660" y1="0" x2="660" y2="480"/> <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="780" y1="0" x2="780" y2="480"/> <line x1="840" y1="0" x2="840" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/> <line x1="960" y1="0" x2="960" y2="480"/>
    <line x1="1020" y1="0" x2="1020" y2="480"/> <line x1="1080" y1="0" x2="1080" y2="480"/>
    <line x1="1140" y1="0" x2="1140" y2="480"/> <line x1="1200" y1="0" x2="1200" y2="480"/>
    <line x1="1260" y1="0" x2="1260" y2="480"/> <line x1="1320" y1="0" x2="1320" y2="480"/>
    <line x1="0" y1="60"  x2="1360" y2="60"/>  <line x1="0" y1="120" x2="1360" y2="120"/>
    <line x1="0" y1="180" x2="1360" y2="180"/> <line x1="0" y1="240" x2="1360" y2="240"/>
    <line x1="0" y1="300" x2="1360" y2="300"/> <line x1="0" y1="360" x2="1360" y2="360"/>
    <line x1="0" y1="420" x2="1360" y2="420"/>
  </g>

  <!-- Trilhas esquerda -->
  <g stroke="#2864b4" stroke-width="2" fill="none">
    <polyline points="0,120 80,120 80,200 30,200 30,320 120,320 120,380 0,380"/>
  </g>
  <g fill="#2864b4">
    <circle cx="80"  cy="120" r="5"/> <circle cx="80"  cy="200" r="5"/>
    <circle cx="30"  cy="200" r="5"/> <circle cx="30"  cy="320" r="5"/>
    <circle cx="120" cy="320" r="5"/> <circle cx="120" cy="380" r="5"/>
  </g>

  <!-- Trilhas direita -->
  <g stroke="#2864b4" stroke-width="2" fill="none">
    <polyline points="1360,100 1270,100 1270,180 1320,180 1320,300 1230,300 1230,400 1360,400"/>
  </g>
  <g fill="#2864b4">
    <circle cx="1270" cy="100" r="5"/> <circle cx="1270" cy="180" r="5"/>
    <circle cx="1320" cy="180" r="5"/> <circle cx="1320" cy="300" r="5"/>
    <circle cx="1230" cy="300" r="5"/> <circle cx="1230" cy="400" r="5"/>
  </g>

  <!-- Trilhas superior -->
  <g stroke="#2864b4" stroke-width="2" fill="none">
    <polyline points="400,0 400,60 500,60 500,30 700,30 700,60 800,60 800,0"/>
  </g>
  <g fill="#2864b4">
    <circle cx="400" cy="60" r="5"/> <circle cx="500" cy="60" r="5"/>
    <circle cx="700" cy="60" r="5"/> <circle cx="800" cy="60" r="5"/>
  </g>

  <!-- Anel NeoPixel (canto superior esquerdo) -->
  <circle cx="200" cy="90" r="55" fill="none" stroke="#2864b4" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="90" r="18" fill="#1e3880" stroke="#2864b4" stroke-width="2"/>
  <!-- 16 LEDs do anel -->
  <circle cx="200" cy="35"  r="7" fill="#dc3c3c"/>
  <circle cx="222" cy="38"  r="7" fill="#ff6400"/>
  <circle cx="241" cy="51"  r="7" fill="#f0c828"/>
  <circle cx="251" cy="70"  r="7" fill="#b4ff00"/>
  <circle cx="251" cy="110" r="7" fill="#2ecc71"/>
  <circle cx="241" cy="129" r="7" fill="#00ffb4"/>
  <circle cx="222" cy="142" r="7" fill="#3ca0ff"/>
  <circle cx="200" cy="145" r="7" fill="#0064ff"/>
  <circle cx="178" cy="142" r="7" fill="#5000ff"/>
  <circle cx="159" cy="129" r="7" fill="#a000ff"/>
  <circle cx="149" cy="110" r="7" fill="#dc00c8"/>
  <circle cx="149" cy="70"  r="7" fill="#dc3c3c"/>
  <circle cx="159" cy="51"  r="7" fill="#ff6400"/>
  <circle cx="178" cy="38"  r="7" fill="#f0c828"/>
  <circle cx="200" cy="35"  r="7" fill="#2ecc71"/>
  <circle cx="222" cy="38"  r="7" fill="#3ca0ff"/>

  <!-- Chip ESP32 (canto superior direito) -->
  <rect x="1130" y="40" width="80" height="70" fill="#142050" stroke="#2864b4" stroke-width="2"/>
  <g stroke="#2864b4" stroke-width="2">
    <line x1="1116" y1="50"  x2="1130" y2="50"/>  <line x1="1116" y1="62"  x2="1130" y2="62"/>
    <line x1="1116" y1="74"  x2="1130" y2="74"/>  <line x1="1116" y1="86"  x2="1130" y2="86"/>
    <line x1="1116" y1="98"  x2="1130" y2="98"/>
    <line x1="1210" y1="50"  x2="1224" y2="50"/>  <line x1="1210" y1="62"  x2="1224" y2="62"/>
    <line x1="1210" y1="74"  x2="1224" y2="74"/>  <line x1="1210" y1="86"  x2="1224" y2="86"/>
    <line x1="1210" y1="98"  x2="1224" y2="98"/>
  </g>

  <!-- LEDs RGB fileira inferior -->
  <g>
    <!-- LED 1 vermelho -->
    <ellipse cx="500" cy="392" rx="10" ry="14" fill="#dc3c3c"/>
    <rect x="493" y="404" width="14" height="16" fill="#dc3c3c"/>
    <line x1="496" y1="420" x2="496" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="504" y1="420" x2="504" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 2 amarelo -->
    <ellipse cx="560" cy="392" rx="10" ry="14" fill="#f0c828"/>
    <rect x="553" y="404" width="14" height="16" fill="#f0c828"/>
    <line x1="556" y1="420" x2="556" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="564" y1="420" x2="564" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 3 verde -->
    <ellipse cx="620" cy="392" rx="10" ry="14" fill="#2ecc71"/>
    <rect x="613" y="404" width="14" height="16" fill="#2ecc71"/>
    <line x1="616" y1="420" x2="616" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="624" y1="420" x2="624" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 4 azul -->
    <ellipse cx="680" cy="392" rx="10" ry="14" fill="#3ca0ff"/>
    <rect x="673" y="404" width="14" height="16" fill="#3ca0ff"/>
    <line x1="676" y1="420" x2="676" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="684" y1="420" x2="684" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 5 violeta -->
    <ellipse cx="740" cy="392" rx="10" ry="14" fill="#a000ff"/>
    <rect x="733" y="404" width="14" height="16" fill="#a000ff"/>
    <line x1="736" y1="420" x2="736" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="744" y1="420" x2="744" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 6 vermelho -->
    <ellipse cx="800" cy="392" rx="10" ry="14" fill="#dc3c3c"/>
    <rect x="793" y="404" width="14" height="16" fill="#dc3c3c"/>
    <line x1="796" y1="420" x2="796" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="804" y1="420" x2="804" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 7 amarelo -->
    <ellipse cx="860" cy="392" rx="10" ry="14" fill="#f0c828"/>
    <rect x="853" y="404" width="14" height="16" fill="#f0c828"/>
    <line x1="856" y1="420" x2="856" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="864" y1="420" x2="864" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <!-- LED 8 verde -->
    <ellipse cx="920" cy="392" rx="10" ry="14" fill="#2ecc71"/>
    <rect x="913" y="404" width="14" height="16" fill="#2ecc71"/>
    <line x1="916" y1="420" x2="916" y2="435" stroke="#c8dcff" stroke-width="2"/>
    <line x1="924" y1="420" x2="924" y2="435" stroke="#c8dcff" stroke-width="2"/>
  </g>

  <!-- Textos de canto -->
  <g font-family="monospace" font-size="16" fill="#c8dcff">
    <text x="18" y="34">np[i] = (R, G, B)</text>
    <text x="18" y="56">np.write()</text>
    <text x="18" y="406">CORES["vermelho"]</text>
    <text x="18" y="428">i % NUM_LEDS</text>
    <text x="1060" y="34">neopixel.NeoPixel()</text>
    <text x="1090" y="56">sleep_ms(80)</text>
    <text x="1070" y="406">acender_todos(cor)</text>
    <text x="1075" y="428">cores[1:]+cores[:1]</text>
  </g>

  <!-- Título principal -->
  <text x="680" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="88"
        font-weight="bold" fill="#ffffff" text-anchor="middle"
        filter="url(#sombra)">Sistemas Embarcados</text>

  <!-- Linha separadora -->
  <line x1="230" y1="272" x2="1130" y2="272" stroke="#2ecc71" stroke-width="2"/>

  <!-- Subtítulo -->
  <text x="680" y="310" font-family="monospace" font-size="36"
        font-weight="bold" fill="#2ecc71" text-anchor="middle">LEDs RGB e Efeitos Visuais com ESP32</text>

  <!-- Detalhe -->
  <text x="680" y="356" font-family="monospace" font-size="24"
        fill="#c8dcff" text-anchor="middle">MicroPython  ·  WS2812B  ·  Wokwi</text>
</svg>
